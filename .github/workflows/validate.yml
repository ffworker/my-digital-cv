name: Validate CV source

on:
  pull_request:
    paths:
      - 'index.html'
      - 'skills.html'
      - 'de/**'
      - 'sites/**'
      - 'assets/**'
      - 'styles.css'
      - 'script.js'
      - '.github/workflows/validate.yml'
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'skills.html'
      - 'de/**'
      - 'sites/**'
      - 'assets/**'
      - 'styles.css'
      - 'script.js'
      - '.github/workflows/validate.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cv-source-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate required static-site files
        run: |
          set -euo pipefail
          test -s index.html
          test -s de/index.html
          test -s skills.html
          test -s de/skills.html
          test -s styles.css
          test -s script.js
          test -s assets/favicon.svg
      - name: Check HTML and local asset references
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          root = Path('.')
          pages = [root/'index.html', root/'de/index.html', root/'skills.html', root/'de/skills.html']
          for page in pages:
              text = page.read_text()
              if '<html' not in text or '</html>' not in text:
                  raise SystemExit(f'{page}: incomplete HTML document')
              for ref in re.findall(r'''(?:href|src)=["'](/[^"'#?]+)''', text):
                  target = root / ref.lstrip('/')
                  if not target.exists():
                      raise SystemExit(f'{page}: missing local asset {ref}')
          print('required pages and local asset references validated')
          PY
