name: One-off verify exact live CV route after GitOps release
on:
  push:
    branches: [diagnostics/cv-public-css-nov02]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - name: Verify extensionless skills route on the public site
        shell: bash
        run: |
          set -u
          for i in $(seq 1 8); do
            for suffix in /de/skills /de/skills/ /de/skills.html /skills /skills/; do
              url="https://cv.bytegeist.dev$suffix"
              status=$(curl -LsS --connect-timeout 5 --max-time 12 -o /tmp/cv-route -w '%{http_code}' "$url") || status=ERR
              marker=$(grep -oc 'class="professional-story"' /tmp/cv-route || true)
              title=$(grep -om1 '<title>[^<]*</title>' /tmp/cv-route | head -c 100 || true)
              printf "ATTEMPT=%s PATH=%s HTTP=%s STORY=%s TITLE=%s\n" "$i" "$suffix" "$status" "$marker" "$title"
            done
            if grep -q 'class="professional-story"' /tmp/cv-route; then
              # Always explicitly verify the exact URL, not the last loop result.
              curl -LsS --max-time 12 -o /tmp/cv-exact https://cv.bytegeist.dev/de/skills || true
              if grep -q 'class="professional-story"' /tmp/cv-exact; then
                echo "LIVE_EXACT_ROUTE_PASS"
                exit 0
              fi
            fi
            sleep 11
          done
          echo "LIVE_EXACT_ROUTE_NOT_YET_FIXED"
          exit 1
