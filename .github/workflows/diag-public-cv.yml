name: One-off compare exact preview and live skills URLs
on:
  push:
    branches: [diagnostics/cv-public-css-nov02]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Read-only route and CSS comparison
        shell: bash
        run: |
          set -u
          for origin in https://cv.bytegeist.dev https://9d984d33.mywebsite-ebw.pages.dev; do
            for path in '/de/skills' '/de/skills?utm_source=chatgpt.com' '/de/skills.html' '/de/index.html' '/skills-professional.css' '/skills-professional.css?v=241e70aa91c3'; do
              url="$origin$path"
              code=$(curl --connect-timeout 5 --max-time 12 --compressed --silent --show-error --location -o /tmp/check-body -D /tmp/check-headers -w '%{http_code}' "$url") || code="ERR"
              hash=$(sha256sum /tmp/check-body | cut -c1-20)
              bytes=$(wc -c </tmp/check-body)
              title=$(grep -om1 '<title>[^<]*</title>' /tmp/check-body | head -c 110 || true)
              stylesheet=$(grep -om1 'href="/skills-professional.css[^"]*"' /tmp/check-body || true)
              echo "RESULT url=$url status=$code bytes=$bytes sha=$hash title=$title cssLink=$stylesheet"
              grep -iE '^content-type:|^cache-control:|^location:' /tmp/check-headers | tr '\n' ';' || true
              echo
            done
          done
      - name: Compare browser-rendered screenshots if Chrome available
        shell: bash
        run: |
          set -u
          command -v google-chrome || true
          command -v chromium || true
          CHROME=$(command -v google-chrome || command -v chromium || echo "")
          if [ -z "$CHROME" ]; then echo "Chrome not installed; skip screenshot"; exit 0; fi
          for host in live preview; do
            if [ "$host" = live ]; then url=https://cv.bytegeist.dev/de/skills; else url=https://9d984d33.mywebsite-ebw.pages.dev/de/skills; fi
            timeout 35 "$CHROME" --headless --no-sandbox --disable-gpu --hide-scrollbars --window-size=1280,900 --virtual-time-budget=4500 --screenshot="/tmp/$host.png" "$url" 2>/dev/null || true
            file "/tmp/$host.png" || true
            sha256sum "/tmp/$host.png" || true
          done
          python - <<'PY'
          try:
              from PIL import Image, ImageChops
              a=Image.open('/tmp/live.png').convert('RGB')
              b=Image.open('/tmp/preview.png').convert('RGB')
              diff=ImageChops.difference(a,b)
              box=diff.getbbox()
              print('RENDER_DIFF', 'images_identical' if box is None else f'bbox={box}', 'sizes',a.size,b.size)
              print('PIXELS', 'live-bg',a.getpixel((10,350)), 'preview-bg',b.getpixel((10,350)))
          except Exception as exc:
              print('Screenshot comparison unavailable',str(exc))
          PY
